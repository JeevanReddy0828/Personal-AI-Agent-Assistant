<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in</title><style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e1116;color:#e6edf3;
     font:16px/1.5 -apple-system,'Segoe UI Variable','Segoe UI',system-ui,sans-serif}
form{box-sizing:border-box;width:min(22rem,calc(100vw - 32px));padding:1.6rem;background:#161b22;border:1px solid #263040;border-radius:14px}
h1{margin:0 0 1.1rem;font-size:1.05rem}
label{display:block;font-size:.8rem;color:#8b98a9;margin:0 0 .3rem}
input,button{width:100%;box-sizing:border-box;font:inherit;border-radius:9px}
input{padding:.7rem .8rem;background:#0e1116;border:1px solid #2d3748;color:inherit;margin-bottom:.8rem}
input:focus-visible,button:focus-visible{outline:2px solid #2dd4bf;outline-offset:2px}
button{padding:.7rem;border:0;background:#2dd4bf;color:#06232b;font-weight:600;cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
.err{color:#f87171;font-size:.82rem;min-height:1.2em;margin:.6rem 0 0}
</style></head><body>
<form id="f" novalidate><h1>Sign in</h1>
<label for="u">Username</label>
<input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
<label for="p">Password</label>
<input id="p" name="password" type="password" autocomplete="current-password" required>
<button id="b" type="submit">Sign in</button><div class="err" id="e" role="alert"></div></form>
<script nonce="{{NONCE}}">
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const err = document.getElementById('e'), button = document.getElementById('b');
  err.textContent = ''; button.disabled = true;
  try{
    const r = await fetch('/auth/login', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username: document.getElementById('u').value, password: document.getElementById('p').value})});
    // The same address again, query included: the desktop window is /?app=1.
    if (r.ok) { location.replace(location.pathname + location.search); return; }
    // Say what the server said, never a guessed cause: a 429 is not a wrong password.
    const d = await r.json().catch(() => ({}));
    err.textContent = d.message || ('Could not sign in (HTTP ' + r.status + ').');
  }catch(e){ err.textContent = 'Could not reach the app.'; }
  button.disabled = false;
});
</script></body></html>
