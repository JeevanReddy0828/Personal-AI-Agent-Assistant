name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B tests/run_tests.py
  browser:
    runs-on: ubuntu-latest
    env:
      JARVIS_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install playwright pypdf
      - run: python -m playwright install --with-deps chromium
      - run: python -B tests/run_tests.py test_browser_regressions.py
