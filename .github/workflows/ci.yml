name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Windows ships no time zone database, so zoneinfo cannot resolve a named zone and
      # four clock tests could not run there at all. A test-only install: the package
      # itself still declares no runtime dependencies, and the app degrades gracefully
      # without it. Linux has one system-wide and is unaffected.
      - run: pip install tzdata
      - run: python -B tests/run_tests.py
  browser:
    runs-on: ubuntu-latest
    env:
      JARVIS_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install playwright pypdf
      - run: python -m playwright install --with-deps chromium
      - run: python -B tests/run_tests.py test_browser_regressions.py
