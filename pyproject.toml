[project]
name = "laptop-agent"
version = "0.43.0"
description = "Local-first, voice-capable personal laptop agent (J.A.R.V.I.S) with an LLM brain, safe tools behind an approval gate, and Obsidian-backed memory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jeevan Arlagadda" }]
keywords = ["assistant", "agent", "llm", "voice", "local-first", "obsidian", "jarvis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/JeevanReddy0828/Personal-AI-Agent-Assistant"
Repository = "https://github.com/JeevanReddy0828/Personal-AI-Agent-Assistant"
Issues = "https://github.com/JeevanReddy0828/Personal-AI-Agent-Assistant/issues"

[project.optional-dependencies]
voice = ["pyttsx3>=2.90", "SpeechRecognition>=3.10.0"]
app = ["pywebview>=4.4"]
browser = ["playwright>=1.45.0"]
desktop = ["pyautogui>=0.9.54", "pillow>=10.0.0"]
docs = ["pdfplumber>=0.11.0", "pypdf>=4.0.0", "python-docx>=1.1.0", "python-pptx>=1.0.0"]
ocr = ["pytesseract>=0.3.10", "pillow>=10.0.0"]
transcribe = ["openai-whisper>=20231117"]
stt = ["vosk>=0.3.45"]
# Hosted NVIDIA speech (Parakeet) is Riva gRPC, not the REST catalog.
riva = ["nvidia-riva-client>=2.14"]
youtube = ["youtube-transcript-api>=0.6.2"]
metrics = ["psutil>=5.9.0"]
vision = ["opencv-python>=4.8.0"]
dev = []

[project.scripts]
laptop-agent = "laptop_agent.cli:main"
laptop-agent-gui = "laptop_agent.dashboard:main"
laptop-agent-dashboard = "laptop_agent.dashboard:main"
laptop-agent-deck = "laptop_agent.webui:run_desktop"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
# The page is assembled from these at import; a wheel without them cannot start.
"laptop_agent" = ["webui_assets/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Correctness only: syntax errors, undefined names, invalid comparisons, unused imports.
# Style rules are not enforced yet; widening this needs a clean-up of the existing code first.
select = ["E9", "F63", "F7", "F82", "F401"]

[tool.mypy]
python_version = "3.11"
files = ["src/laptop_agent"]

# Optional extras that mypy can see being imported; CI installs none of them.
[[tool.mypy.overrides]]
module = ["PIL.*", "docx.*", "numpy.*", "playwright.*", "pptx.*"]
ignore_missing_imports = true

# Modules with errors on 2026-11-10 (mypy 2.4.1, 239 errors on Linux). Every other module,
# and every new one, is checked. Take a module off this list once it is fixed.
[[tool.mypy.overrides]]
module = [
    "laptop_agent.accounts",
    "laptop_agent.advisor",
    "laptop_agent.agents.orchestrator",
    "laptop_agent.analytics.diagnostics",
    "laptop_agent.analytics.forecast",
    "laptop_agent.app",
    "laptop_agent.autopilot",
    "laptop_agent.context",
    "laptop_agent.dashboard",
    "laptop_agent.failures",
    "laptop_agent.jobs",
    "laptop_agent.knowledge",
    "laptop_agent.metrics",
    "laptop_agent.planner.heuristic",
    "laptop_agent.reasoning",
    "laptop_agent.reminders",
    "laptop_agent.scheduler",
    "laptop_agent.storage",
    "laptop_agent.tasks",
    "laptop_agent.timeparse",
    "laptop_agent.token_vault",
    "laptop_agent.tools.breakdown",
    "laptop_agent.tools.browser",
    "laptop_agent.tools.calculator",
    "laptop_agent.tools.clipboard",
    "laptop_agent.tools.clock",
    "laptop_agent.tools.codefix",
    "laptop_agent.tools.dates",
    "laptop_agent.tools.diagnostics",
    "laptop_agent.tools.document",
    "laptop_agent.tools.email",
    "laptop_agent.tools.fileops",
    "laptop_agent.tools.files",
    "laptop_agent.tools.forecast",
    "laptop_agent.tools.keys",
    "laptop_agent.tools.mcp",
    "laptop_agent.tools.obsidian",
    "laptop_agent.tools.plugins",
    "laptop_agent.tools.research",
    "laptop_agent.tools.system",
    "laptop_agent.tools.travel",
    "laptop_agent.tools.weather",
    "laptop_agent.tools.windows",
    "laptop_agent.tracing",
    "laptop_agent.webui",
    "laptop_agent.window_fx",
    "laptop_agent.workflows",
]
ignore_errors = true
